name: Objava na GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "og-image.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pripremi igru i OG sliku za dijeljenje
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f og-image.png ]; then cp og-image.png _site/og-image.png; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
